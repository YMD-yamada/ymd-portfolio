<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Studio</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin admin--simple">
      <header class="admin__head">
        <a href="index.html" class="admin__back">プレビュー</a>
        <h1>公開するアプリを選ぶ</h1>
        <p>チェックしたものを、下のボタン1つで本番に反映します。</p>
      </header>

      <section class="card" id="gate-card">
        <h2>起動中…</h2>
        <p class="muted">`npm run studio` でこの画面を開いてください。</p>
        <p id="gate-status" class="status" role="status"></p>
      </section>

      <section class="card hidden" id="apps-card">
        <div class="row row--between">
          <h2>候補</h2>
          <div class="row">
            <button id="select-all" type="button">全部</button>
            <button id="select-none" type="button">なし</button>
            <button id="refresh-candidates" type="button">更新</button>
          </div>
        </div>
        <div id="editor"></div>
      </section>

      <details class="card hidden" id="studio-card">
        <summary>カテゴリの並び（任意）</summary>
        <div class="row" style="margin-top:0.8rem">
          <input id="new-category" type="text" placeholder="新しいカテゴリ名" />
          <button id="add-category" type="button">追加</button>
        </div>
        <div id="category-manager"></div>
      </details>
    </main>

    <div class="dock hidden" id="save-card">
      <div class="dock__left">
        <strong id="selection-count">選択 0</strong>
        <span id="status" class="status" role="status"></span>
      </div>
      <button id="ship" class="primary dock__btn" type="button">本番に反映</button>
    </div>

    <script src="admin.js" defer></script>
  </body>
</html>
