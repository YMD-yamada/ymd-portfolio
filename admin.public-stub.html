<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理はローカルのみ</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body {
        margin: 0;
        font-family: "Noto Sans JP", system-ui, sans-serif;
        background: #101814;
        color: #e7f0ec;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        max-width: 36rem;
        border: 1px solid #2a3631;
        border-radius: 14px;
        padding: 1.4rem 1.5rem;
        background: #18201d;
      }
      h1 { margin: 0 0 0.6rem; font-size: 1.25rem; }
      p { margin: 0.45rem 0; color: #9eb2aa; line-height: 1.55; }
      a { color: #6fe6b6; }
    </style>
  </head>
  <body>
    <main>
      <h1>制作物の編集はローカル専用です</h1>
      <p>
        セキュリティのため、本番サイト上での一覧編集・GitHub Token 入力は廃止しました。
        公開するアプリの選択と設定は、手元のリポジトリで
        <code>npm run studio</code>
        を起動して行います。
      </p>
      <p><a href="/">公開ページへ戻る</a></p>
    </main>
  </body>
</html>
