  <style>

    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(165deg,#15201b,var(--bg) 55%);color:var(--ink);line-height:1.55;padding:1rem 1rem 6.5rem}

  const KEY = "mb_sess_v2";
  function b64ToBytes(b64){const b=atob(b64);const o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
  async function deriveKey(pin,salt){
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }
  async function decrypt(pin){
    const all=b64ToBytes(PAYLOAD);
    const salt=all.slice(0,16), iv=all.slice(16,28), tag=all.slice(28,44), data=all.slice(44);
    const key=await deriveKey(pin,salt);
    const packed=new Uint8Array(data.length+tag.length); packed.set(data,0); packed.set(tag,data.length);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,packed);
    return new TextDecoder().decode(buf);
  }
  function linkify(text){
    const esc=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function extractPrompt(md){
    const m=md.match(/```[\s\S]*?\n([\s\S]*?)```/);
    return (m&&m[1]?m[1]:"").trim();
  }
  let mdCache="";
  function show(md){
    mdCache=md;
    document.getElementById("view").innerHTML=linkify(md);
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("board").classList.remove("hidden");
    document.getElementById("dock").classList.remove("hidden");
  }
  async function unlock(pin,persist){
    const md=await decrypt(pin);
    if(persist) sessionStorage.setItem(KEY,JSON.stringify({pin,at:Date.now()}));
    show(md);
  }
  document.getElementById("unlock").onclick=async()=>{
    const err=document.getElementById("err"); err.textContent="";
    const pin=document.getElementById("pin").value.trim();
    if(!pin){err.textContent="PINを入力";return;}
    try{await unlock(pin,true)}catch{err.textContent="PINが違います"}
  };
  document.getElementById("lock").onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
  async function copy(){
    const t=extractPrompt(mdCache)||"";
    try{await navigator.clipboard.writeText(t);alert("コピーしました")}catch{prompt("コピー",t)}
  }
  document.getElementById("copy").onclick=copy;
  document.getElementById("copy2").onclick=copy;
  (async()=>{
    try{
      const raw=sessionStorage.getItem(KEY); if(!raw) return;
      const {pin,at}=JSON.parse(raw);
      if(!pin||Date.now()-at>12*60*60*1000){sessionStorage.removeItem(KEY);return}
      await unlock(pin,true);
    }catch{sessionStorage.removeItem(KEY)}
  })();
  </script>
